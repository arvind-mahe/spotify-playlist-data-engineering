name: Spotify analytics CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest dbt-core dbt-duckdb
      - name: Python tests
        run: python -m pytest -q tests/
      - name: Parse dbt graph (no dataset required)
        run: dbt parse --project-dir dbt_project --profiles-dir dbt_project
      - name: Build dbt using synthetic fixture
        run: |
          python scripts/create_demo_silver.py
          dbt build --project-dir dbt_project --profiles-dir dbt_project
